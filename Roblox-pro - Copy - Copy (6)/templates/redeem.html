<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<title>Redeem Code - Roblox Pro</title>


<style>

body{

direction:rtl;
font-family:tahoma;
background:linear-gradient(135deg,#12001f,#2d0066);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;

}


.card{

background:#1f1f1f;
width:350px;
padding:30px;
border-radius:25px;
box-shadow:0 0 30px #8b5cf6;
text-align:center;

}


h1{

color:#c084fc;

}


input{

width:90%;
padding:15px;
border-radius:15px;
border:none;
margin:15px 0;
font-size:16px;

}


button{

width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#a855f7;
color:white;
font-size:18px;
cursor:pointer;

}


button:hover{

background:#9333ea;

}


.message{

margin-top:20px;
font-size:18px;

}


.back{

display:block;
margin-top:20px;
color:#d8b4fe;
text-decoration:none;

}


</style>


</head>


<body>


<div class="card">


<h1>
🎁 Redeem Code
</h1>


<p>
کد هدیه Roblox Pro خود را وارد کنید
</p>



<form method="POST">


<input

name="code"

placeholder="مثلا ROBLOX_PRO"

required

>


<button>
Redeem ✨
</button>


</form>



{% if message %}

<div class="message">

{{message}}

</div>

{% endif %}



<a class="back" href="/">
بازگشت به خانه 🏠
</a>



</div>



</body>

</html>

<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<title>Seeds</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">

</head>


<body>


<header class="header">

<div class="logo">
🌱 Seeds
</div>


<a href="/cart">

<button class="icon-btn">
🛒
</button>

</a>

</header>




<section class="shop-page">


<h1>
🌱 Seeds
</h1>


<p class="subtitle">
انتخاب سید
</p>




<div class="seed-container">


{% for item in items %}


<div class="seed-card">


<div class="seed-image">

{% if item.image %}

<img src="{{ item.image }}" width="120">

{% else %}

🌱

{% endif %}

</div>



<h2>
{{ item.name }}
</h2>



<p>
{{ item.price }} تومان
</p>



<a href="/add_cart/{{ item.name }}/{{ item.price }}">

<button class="buy-btn">

افزودن به سبد خرید

</button>

</a>


</div>


{% endfor %}



</div>


</section>


</body>

</html>
